name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Record immutability is checked against history, so the clone cannot be shallow.
          fetch-depth: 0

      - name: Landed branches are gone
        run: |
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          stale=$(git branch -r --merged origin/main | grep -vE 'origin/(main|HEAD)$' || true)
          if [ -n "$stale" ]; then
            echo "$stale"
            echo "A landed branch outlives its landing; delete it locally and on the remote in the push that moves main."
            exit 1
          fi

      - name: Pins
        # Red here means a copy diverged from the style, or the style moved and this
        # project needs re-alignment; the pins update with the alignment. The audit
        # script and its selftest are pinned beside the rulebook and checked before
        # they run, because a checker the checked project can edit is no checker at all.
        run: |
          echo "f45f0f2bef76fa82d46bdd73a897801575b86d55e6d1897e2cb3ff7ac1c43a65  docs/CONVENTIONS.md" | sha256sum -c -
          echo "54280b0fcf2e6d76351f7d4c667618e053f67245529064e354c9a860cc1a5569  scripts/audit-docs.mjs" | sha256sum -c -
          echo "6477e80b5b041960736759b6addc917f2ccf8568255b639849cce5b566728034  scripts/audit-docs-selftest.mjs" | sha256sum -c -

      - name: Seams
        run: |
          if git grep -nE "vi\.mock\(" -- tests; then
            echo "Module mocking is banned; substitute only at a declared seam."
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: |
          npm ci
          # The docs audit's spelling advisory runs where codespell is installed.
          pipx install codespell

      - name: Audit selftest
        run: node scripts/audit-docs-selftest.mjs

      - name: Docs
        run: node scripts/audit-docs.mjs

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
