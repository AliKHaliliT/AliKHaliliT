name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prose
        run: |
          if git grep -PIn "\x{2014}"; then
            echo "Em dashes are banned in every tracked byte."
            exit 1
          fi

      - name: Pins
        # Red here means a copy diverged from the style, or the style moved and this
        # project needs re-alignment; both pins update with the alignment. The audit
        # script is pinned beside the rulebook and checked before it runs, because a
        # checker the checked project can edit is no checker at all.
        run: |
          echo "05a329506f6acf4ed173bfb7e5f6b7284ef69a00c019cd4c41d1ac5ec3dbcd69  docs/CONVENTIONS.md" | sha256sum -c -
          echo "6c876680d2c8facf2c279ea3e13b9b5e2763af2e59fe0b48b8efb6d6f7593ad0  scripts/audit-docs.mjs" | sha256sum -c -

      - name: Docs
        run: node scripts/audit-docs.mjs

      - name: Seams
        run: |
          if git grep -nE "vi\.mock\(" -- tests; then
            echo "Module mocking is banned; substitute only at a declared seam."
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
