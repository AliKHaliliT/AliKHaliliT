name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Record immutability is checked against history, so the clone cannot be shallow.
          fetch-depth: 0

      - name: Landed branches are gone
        run: |
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          stale=$(git branch -r --merged origin/main | grep -vE 'origin/(main|HEAD)$' || true)
          if [ -n "$stale" ]; then
            echo "$stale"
            echo "A landed branch outlives its landing; delete it locally and on the remote in the push that moves main."
            exit 1
          fi

      - name: Pins
        # Red here means a copy diverged from the style, or the style moved and this
        # project needs re-alignment; the pins update with the alignment. The audit
        # script and its selftest are pinned beside the rulebook and checked before
        # they run, because a checker the checked project can edit is no checker at all.
        run: |
          echo "b43956e7cd0a89a593b88a64dd1d36c1f75142852a8a3dcf54af11b8b583de11  docs/CONVENTIONS.md" | sha256sum -c -
          echo "b78e085b296e38a5c6e543de4bfd4c43b8cf60f247caa881806a9f6858a96ba8  scripts/audit-docs.mjs" | sha256sum -c -
          echo "2e98c4d3dc5dca487bb151d3f704ce94d8f8b4f5add56388e393dec82fb83395  scripts/audit-docs-selftest.mjs" | sha256sum -c -

      - name: Seams
        run: |
          if git grep -nE "vi\.mock\(" -- tests; then
            echo "Module mocking is banned; substitute only at a declared seam."
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: |
          npm ci
          # The docs audit's spelling advisory runs where codespell is installed.
          pipx install codespell

      - name: Audit selftest
        run: node scripts/audit-docs-selftest.mjs

      - name: Docs
        run: node scripts/audit-docs.mjs

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
