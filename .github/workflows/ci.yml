name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Prose
        run: |
          if git grep -PIn "\x{2014}"; then
            echo "Em dashes are banned in every tracked byte."
            exit 1
          fi

      - name: Docs
        run: node scripts/audit-docs.mjs

      - name: Rulebook
        # Red here means this copy diverged from the style's rulebook, or the style
        # moved and this project needs re-alignment; the pin updates with the alignment.
        run: |
          echo "e753cf8b77378d7618e68880865d616e3df12e675f0c1b394bab2230b46368c6  docs/CONVENTIONS.md" | sha256sum -c -

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
