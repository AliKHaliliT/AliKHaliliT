name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Record immutability is checked against history, so the clone cannot be shallow.
          fetch-depth: 0

      - name: Em dash budget, two per file
        run: |
          git grep -PIno "\x{2014}" -- . > em-dashes.tmp || true
          awk -F: '{count[$1]++} END {bad = 0; for (f in count) if (count[f] > 2) { printf "%s carries %d em dashes; the budget is two per file\n", f, count[f]; bad = 1 }; exit bad}' em-dashes.tmp
          rm em-dashes.tmp

      - name: Prose heuristics, advisory
        continue-on-error: true
        run: |
          if git grep -inE "paradigm shift|game.changer|ever-evolving|cutting.edge|\bdelve|\btapestry\b|\bsupercharge|\btransformative\b|\bmultifaceted\b|\bmeticulous\b|\bparamount\b|\bembark\b|it.s worth noting|at the end of the day|in today.s world|let.s dive|going forward|a testament to|marks a pivotal|plays a vital role|experts agree|studies show|widely regarded as" -- . ":(exclude)*.github*" ":(exclude)*docs/CONVENTIONS.md" ":(exclude)*docs/decisions/*"; then
            echo "Inflated vocabulary or weasel attribution in living prose; the verdict is review's."
            exit 1
          fi

      - name: Pins
        # Red here means a copy diverged from the style, or the style moved and this
        # project needs re-alignment; both pins update with the alignment. The audit
        # script is pinned beside the rulebook and checked before it runs, because a
        # checker the checked project can edit is no checker at all.
        run: |
          echo "a8cfa14879b46ce4b9a34996fc68d776d92e06bcda8216a2ff99baf40191c743  docs/CONVENTIONS.md" | sha256sum -c -
          echo "98eaa92761e223eefb1ca0894658d25475ecf40b827fc0f01366c9a25cc0c359  scripts/audit-docs.mjs" | sha256sum -c -

      - name: Seams
        run: |
          if git grep -nE "vi\.mock\(" -- tests; then
            echo "Module mocking is banned; substitute only at a declared seam."
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Docs
        run: node scripts/audit-docs.mjs

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
